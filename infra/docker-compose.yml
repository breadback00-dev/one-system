services:
  postgres:
    image: postgres:16
    container_name: one-system-postgres
    environment:
      POSTGRES_DB: one_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - one-system-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d one_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  one-system-postgres-data:
